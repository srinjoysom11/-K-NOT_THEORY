# D5 (research/exact/DMON_IDEAS.md): knotted L-edge half-space arcs (L = 19, 20, 21), arcknot.cpp | unknot_cert.cpp, in parts.
# A separate workflow on branch claude/dmon-experiments.  Started by pushing a change to research/exact/ci/arc19_request.json:
#   {"runs": [{"L": 20, "m": 128, "parts": [0, 1, ..., 127]}, {"L": 21, "m": 256, "parts": [0, ..., 255]}]}  (or one run as {"L": .., "m": .., "parts": [..]})
# Each job runs 4 consecutive entries of "parts" at once (one per core).  A part counts as done only if arcknot and unknot_cert both
# printed their summary.  The last job commits part files named like those of research/exact/run_arc19.sh to research/exact/out/dmon/arc19/.
name: arc19-enum
on:
  push:
    branches: [claude/dmon-experiments]
    paths: [research/exact/ci/arc19_request.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          req = json.load(open('research/exact/ci/arc19_request.json'))
          runs = req["runs"] if "runs" in req else [req]
          inc = []
          for r in runs:
              parts = r["parts"]
              for i in range(0, len(parts), 4):
                  inc.append({"L": r["L"], "m": r["m"], "ps": " ".join(str(p) for p in parts[i:i + 4]), "tag": "L%d_g%d" % (r["L"], i // 4)})
          assert 0 < len(inc) <= 256, len(inc)
          print("matrix=" + json.dumps({"include": inc}))
          PY
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: build and run the parts
        working-directory: research/exact
        run: |
          g++ -O3 -std=c++17 -o arcknot arcknot.cpp
          g++ -O3 -std=c++17 -o unknot_cert unknot_cert.cpp
          # self-test on a stored case: L = 15, whole enumeration: 15608 words printed, all unknotted (PROOF.md section 2b table)
          ./arcknot 15 2> t.log | ./unknot_cert > /dev/null 2> u.log; grep -q "printed=15608" t.log; grep -q "certified_unknot=15608 unresolved=0" u.log
          mkdir -p parts
          L=${{ matrix.L }}; M=${{ matrix.m }}
          one() {
            r=$1; f=parts/arc${L}_part${r}_$M
            s=$(date +%s)
            ./arcknot $L -part $r $M 2> $f.log.tmp | ./unknot_cert > $f.left.tmp 2>> $f.log.tmp
            if grep -q "walks_ending_on_level0" $f.log.tmp && grep -q "^words=.*bad=0 " $f.log.tmp; then
              echo "seconds=$(( $(date +%s) - s )) host=github-actions arcknot.cpp=$(sha256sum arcknot.cpp | cut -c1-16)" >> $f.log.tmp
              mv $f.left.tmp $f.left; mv $f.log.tmp $f.log
            else
              echo "part $r incomplete" >&2
            fi
          }
          for r in ${{ matrix.ps }}; do one $r & done
          wait
          ls parts
      - uses: actions/upload-artifact@v4
        with:
          name: arc_${{ matrix.tag }}
          path: research/exact/parts/
          retention-days: 30
  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset -q --hard FETCH_HEAD
            for f in artifacts/arc*_part*; do
              L=$(basename "$f" | sed 's/^arc\([0-9]*\)_part.*/\1/')
              mkdir -p research/exact/out/dmon/arc$L
              cp "$f" research/exact/out/dmon/arc$L/$(basename "$f" | sed 's/^arc[0-9]*_//')
            done
            git add research/exact/out/dmon
            git commit -q -m "exact: arc19 parts from GitHub Actions run $GITHUB_RUN_ID" || exit 0
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((RANDOM % 30 + 10))
          done
          exit 1
